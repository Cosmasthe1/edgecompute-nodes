services:
  orchestrator:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  simulator:
    build: .
    depends_on:
      orchestrator:
        condition: service_healthy
    command: ["python", "simulator/simulate.py", "--url", "http://orchestrator:8000", "--nodes", "6", "--jobs", "15"]
