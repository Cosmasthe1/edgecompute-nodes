name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned)
        run: pip install -r requirements.lock.txt pytest pytest-cov ruff

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=orchestrator --cov=agent --cov-report=term --cov-fail-under=50
